[project]
name = "moment-gtm-dashboard-api"
version = "0.1.0"
description = "Moment GTM Dashboard — semantic layer + REST API (prototype)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip() over equal-length DB rows/columns

[tool.black]
line-length = 110
